[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-image-crawler"
version = "1.0.0"
description = "Web Image Crawler & Archive Manager by magicplants.net"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Joe Montgomery", email = "joe@magicplants.net" }
]
keywords = ["crawler", "image-scraper", "archive-manager", "gui", "webp-converter"]
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "playwright>=1.40.0"
]

[project.urls]
Homepage = "https://magicplants.net"
Repository = "https://github.com/MagicPlants/web-image-crawler"
